<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' pinlet: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pinlet</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  body { padding: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 6px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-count { font-size: 12px; color: var(--text-3); }
  .section { padding: 8px 10px 6px; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .quick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 0 8px; }
  .quick button {
    position: relative;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
  }
  .quick button:hover { background: #ededeb; }
  .quick .new { border: 1.5px dashed var(--field); background: var(--surface); }
  .hint { padding: 8px 10px; font-size: 12px; color: var(--text-3); }
  .row-update, .row-update > svg { color: var(--brand); font-weight: 500; }
  .row-update:hover { background: var(--brand-soft) !important; }
</style>
</head>
<body>
<div class="pop" id="pop">
  <div class="head">
    <div class="brand">
      <span id="logo" style="display:flex"></span>
      <span class="brand-name">Pinlet</span>
      <span class="brand-count" id="count"></span>
    </div>
    <button class="icon-btn" id="openWin" aria-label="Pinlet 창 열기"></button>
  </div>
  <div class="divider"></div>
  <div id="updateBlock" hidden>
    <button class="row row-update" id="installUpdate"></button>
    <div class="divider"></div>
  </div>
  <div class="section">내 마커</div>
  <div class="quick" id="quick"></div>
  <div class="hint" id="hint"></div>
  <div class="divider"></div>
  <button class="row" id="toggleHidden"></button>
  <button class="row" id="toggleLock" role="switch" aria-checked="false"></button>
  <button class="row" id="clearAll"></button>
  <div class="divider"></div>
  <button class="row" id="openSettings"></button>
  <button class="row" id="quit"></button>
</div>
<script type="module" src="tray.js"></script>
</body>
</html>
