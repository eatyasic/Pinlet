<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Pinlet notice</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: flex-start; padding-top: 8px; }
  .notice {
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--text);
    box-shadow: 0 8px 20px rgba(24, 24, 27, 0.22);
    white-space: nowrap;
  }
  .title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: #fff; }
  .desc { margin-top: 2px; font-size: 11.5px; color: #a1a1aa; }
</style>
</head>
<body>
<div class="notice" role="status">
  <div class="title">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5A2.5 2.5 0 0 1 10.5 5V7"/></svg>
    잠긴 마커예요
  </div>
  <div class="desc">우클릭 → ‘마커 잠금’을 끄면 움직일 수 있어요</div>
</div>
</body>
</html>
